name: Validate skill package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate sources and generated references
        run: python skills/secure-coding/scripts/guide.py check
      - name: Run regression checks
        run: python -B -m unittest discover -s skills/secure-coding/tests -p test_guide.py -v
      - name: Verify deterministic regeneration
        run: python skills/secure-coding/scripts/guide.py build
      - name: Verify tracked files remain unchanged
        run: git diff --exit-code
