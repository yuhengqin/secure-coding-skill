<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="Secure Coding Skill — 225 industrial security rules for AI coding agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#14213C"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#93C5FD" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#38BDF8" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Shield -->
  <g transform="translate(96,110)">
    <path d="M90 0 L180 36 V108 C180 168 146 208 90 232 C34 208 0 168 0 108 V36 Z" fill="url(#shield)"/>
    <path d="M90 14 L166 44 V106 C166 158 137 193 90 214 C43 193 14 158 14 106 V44 Z" fill="none" stroke="#EFF6FF" stroke-opacity="0.55" stroke-width="3"/>
    <path d="M52 116 L80 144 L132 84" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(118,178)">
      <rect width="76" height="34" rx="17" fill="#0B1220" stroke="#38BDF8" stroke-opacity="0.8" stroke-width="2"/>
      <text x="38" y="23" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" fill="#7DD3FC">PY · JS</text>
    </g>
  </g>

  <!-- Text block -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="340" y="130" font-size="66" font-weight="800" fill="#FFFFFF" letter-spacing="1">Secure Coding Skill</text>
    <rect x="340" y="152" width="360" height="5" rx="2.5" fill="url(#glow)"/>
    <text x="340" y="212" font-size="31" font-weight="600" fill="#93C5FD">把 225 条工业级安全规则，装进你的 AI 编码助手</text>
    <text x="340" y="258" font-size="20" fill="#8FA3C8">Retrieve the rules · Build the defenses · Show the evidence</text>

    <!-- Chips -->
    <g font-size="18" font-weight="600">
      <g transform="translate(340,290)">
        <rect width="150" height="40" rx="20" fill="#1D4ED8" fill-opacity="0.35" stroke="#60A5FA" stroke-opacity="0.7"/>
        <text x="75" y="26" text-anchor="middle" fill="#BFDBFE">225 rules</text>
      </g>
      <g transform="translate(502,290)">
        <rect width="170" height="40" rx="20" fill="#1D4ED8" fill-opacity="0.35" stroke="#60A5FA" stroke-opacity="0.7"/>
        <text x="85" y="26" text-anchor="middle" fill="#BFDBFE">5 languages</text>
      </g>
      <g transform="translate(684,290)">
        <rect width="180" height="40" rx="20" fill="#1D4ED8" fill-opacity="0.35" stroke="#60A5FA" stroke-opacity="0.7"/>
        <text x="90" y="26" text-anchor="middle" fill="#BFDBFE">stdlib only</text>
      </g>
      <g transform="translate(876,290)">
        <rect width="170" height="40" rx="20" fill="#1D4ED8" fill-opacity="0.35" stroke="#60A5FA" stroke-opacity="0.7"/>
        <text x="85" y="26" text-anchor="middle" fill="#BFDBFE">Agent Skill</text>
      </g>
    </g>

    <text x="340" y="376" font-size="17" fill="#64748B">Based on Tencent/secguide · CC BY-SA 4.0 · Python · JavaScript/TypeScript · Java · Go · C/C++</text>
  </g>
</svg>
